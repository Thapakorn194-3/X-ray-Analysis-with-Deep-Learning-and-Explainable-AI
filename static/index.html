<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEMO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .upload-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .upload-box {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 50px;
            background: #f8f9ff;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-box:hover {
            background: #eef1ff;
            border-color: #764ba2;
        }

        .upload-box.dragover {
            background: #e3e7ff;
            border-color: #764ba2;
            transform: scale(1.02);
        }

        #fileInput {
            display: none;
        }

        .upload-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 1.1em;
            cursor: pointer;
            transition: transform 0.2s;
            margin: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .predictions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .prediction-card {
            background: linear-gradient(135deg, #f8f9ff 0%, #e3e7ff 100%);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .prediction-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .prediction-card h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .model-badge {
            font-size: 0.7em;
            padding: 5px 12px;
            border-radius: 20px;
            background: #667eea;
            color: white;
        }

        .prediction-result {
            font-size: 2em;
            font-weight: bold;
            margin: 15px 0;
        }

        .result-tb {
            color: #e74c3c;
        }

        .result-normal {
            color: #27ae60;
        }

        .confidence-bar {
            background: #ddd;
            height: 30px;
            border-radius: 15px;
            overflow: hidden;
            margin: 15px 0;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            transition: width 1s;
        }

        .probabilities {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
        }

        .prob-item {
            text-align: center;
            flex: 1;
        }

        .prob-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }

        .prob-value {
            font-size: 1.3em;
            font-weight: bold;
        }

        .xai-section {
            margin-top: 40px;
            padding-top: 40px;
            border-top: 2px solid #eee;
        }

        .xai-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            align-items: center;
        }

        .xai-controls label {
            font-weight: bold;
            color: #667eea;
        }

        .xai-controls select {
            padding: 10px 20px;
            border-radius: 10px;
            border: 2px solid #667eea;
            font-size: 1em;
            cursor: pointer;
        }

        .xai-results {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 25px;
        }

        .xai-image {
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .xai-image img {
            width: 100%;
            height: auto;
            display: block;
        }

        .xai-image h4 {
            background: #667eea;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: #667eea;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            margin-left: 10px;
        }

        .status-available {
            background: #27ae60;
            color: white;
        }

        .status-unavailable {
            background: #e74c3c;
            color: white;
        }

        .image-preview {
            max-width: 100%;
            border-radius: 15px;
            margin: 20px 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }
            
            .predictions-grid {
                grid-template-columns: 1fr;
            }
            
            .xai-results {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🫁 Tuberculosis Detection System</h1>
            <p>Tuberculosis Detection with Explainable AI</p>
        </div>

        <div class="content">
            <!-- Upload Section -->
            <div class="upload-section">
                <div class="upload-box" id="uploadBox">
                    <div class="upload-icon">📤</div>
                    <h2>Upload Chest X-Ray Image</h2>
                    <p>Click or drag and drop an image here</p>
                    <input type="file" id="fileInput" accept="image/*">
                </div>
                <button class="btn" id="predictBtn" disabled>🔍 Predict with All Models</button>
            </div>

            <!-- Image Preview -->
            <div id="imagePreview" style="display: none; text-align: center;">
                <h3>Uploaded Image</h3>
                <img id="previewImg" class="image-preview">
            </div>

            <!-- Loading -->
            <div id="loading" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Analyzing image with all models...</p>
            </div>

            <!-- Predictions -->
            <div id="predictions" style="display: none;">
                <h2 style="margin-bottom: 20px; color: #667eea;">📊 Prediction Results</h2>
                <div class="predictions-grid" id="predictionsGrid"></div>
            </div>

            <!-- XAI Section -->
            <div id="xaiSection" class="xai-section" style="display: none;">
                <h2 style="margin-bottom: 20px; color: #667eea;">🔬 Explainable AI (XAI)</h2>
                
                <div class="xai-controls">
                    <label for="modelSelect">Select Model:</label>
                    <select id="modelSelect">
                        <option value="cnn">CNN (DenseNet121)</option>
                        <option value="svm">SVM + CNN Features</option>
                        <option value="xgb">XGBoost + CNN Features</option>
                    </select>

                    <label for="methodSelect">XAI Method:</label>
                    <select id="methodSelect">
                        <option value="gradcam">Grad-CAM</option>
                        <option value="lime">LIME</option>
                    </select>

                    <button class="btn" id="explainBtn">🔍 Generate Explanation</button>
                </div>

                <div id="xaiLoading" class="loading" style="display: none;">
                    <div class="spinner"></div>
                    <p>Generating XAI explanation...</p>
                </div>

                <div id="xaiResults" class="xai-results"></div>
            </div>
        </div>
    </div>

    <script>
        let uploadedFile = null;
        let modelsStatus = { cnn: false, svm: false, xgb: false };

        // Check models status on load
        async function checkModelsStatus() {
            try {
                const response = await fetch('/models/status');
                modelsStatus = await response.json();
                updateModelSelect();
            } catch (error) {
                console.error('Error checking models status:', error);
            }
        }

        function updateModelSelect() {
            const modelSelect = document.getElementById('modelSelect');
            modelSelect.innerHTML = '';
            
            if (modelsStatus.cnn) {
                modelSelect.innerHTML += '<option value="cnn">CNN (DenseNet121)</option>';
            }
            if (modelsStatus.svm) {
                modelSelect.innerHTML += '<option value="svm">SVM + CNN Features</option>';
            }
            if (modelsStatus.xgb) {
                modelSelect.innerHTML += '<option value="xgb">XGBoost + CNN Features</option>';
            }
            
            updateMethodSelect();
        }

        function updateMethodSelect() {
            const modelSelect = document.getElementById('modelSelect');
            const methodSelect = document.getElementById('methodSelect');
            const selectedModel = modelSelect.value;
            
            methodSelect.innerHTML = '';
            
            if (selectedModel === 'cnn') {
                methodSelect.innerHTML += '<option value="gradcam">Grad-CAM</option>';
            }
            methodSelect.innerHTML += '<option value="lime">LIME</option>';
        }

        // File upload handling
        const uploadBox = document.getElementById('uploadBox');
        const fileInput = document.getElementById('fileInput');
        const predictBtn = document.getElementById('predictBtn');
        const imagePreview = document.getElementById('imagePreview');
        const previewImg = document.getElementById('previewImg');

        uploadBox.addEventListener('click', () => fileInput.click());

        uploadBox.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadBox.classList.add('dragover');
        });

        uploadBox.addEventListener('dragleave', () => {
            uploadBox.classList.remove('dragover');
        });

        uploadBox.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadBox.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleFile(file);
            }
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleFile(file);
            }
        });

        function handleFile(file) {
            uploadedFile = file;
            predictBtn.disabled = false;
            
            // Show preview
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImg.src = e.target.result;
                imagePreview.style.display = 'block';
            };
            reader.readAsDataURL(file);
            
            // Reset results
            document.getElementById('predictions').style.display = 'none';
            document.getElementById('xaiSection').style.display = 'none';
        }

        // Predict with all models
        predictBtn.addEventListener('click', async () => {
            if (!uploadedFile) return;

            const formData = new FormData();
            formData.append('image', uploadedFile);

            document.getElementById('loading').style.display = 'block';
            document.getElementById('predictions').style.display = 'none';
            document.getElementById('xaiSection').style.display = 'none';

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    displayPredictions(data.predictions);
                    document.getElementById('xaiSection').style.display = 'block';
                } else {
                    alert('Error: ' + (data.error || 'Unknown error'));
                }
            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        });

        function displayPredictions(predictions) {
            const grid = document.getElementById('predictionsGrid');
            grid.innerHTML = '';

            const modelNames = {
                'cnn': 'CNN (DenseNet121)',
                'svm': 'SVM + CNN Features',
                'xgb': 'XGBoost + CNN Features'
            };

            for (const [model, pred] of Object.entries(predictions)) {
                const card = document.createElement('div');
                card.className = 'prediction-card';
                
                const resultClass = pred.class === 'TB' ? 'result-tb' : 'result-normal';
                const confidence = (pred.confidence * 100).toFixed(1);
                const probNormal = (pred.prob_normal * 100).toFixed(1);
                const probTB = (pred.prob_tb * 100).toFixed(1);

                card.innerHTML = `
                    <h3>
                        ${modelNames[model]}
                        <span class="model-badge">${model.toUpperCase()}</span>
                    </h3>
                    <div class="prediction-result ${resultClass}">
                        ${pred.class === 'TB' ? '🦠' : '✅'} ${pred.class}
                    </div>
                    <div class="confidence-bar">
                        <div class="confidence-fill" style="width: ${confidence}%">
                            ${confidence}% Confidence
                        </div>
                    </div>
                    <div class="probabilities">
                        <div class="prob-item">
                            <div class="prob-label">Normal</div>
                            <div class="prob-value" style="color: #27ae60;">${probNormal}%</div>
                        </div>
                        <div class="prob-item">
                            <div class="prob-label">TB</div>
                            <div class="prob-value" style="color: #e74c3c;">${probTB}%</div>
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            }

            document.getElementById('predictions').style.display = 'block';
        }

        // XAI Explanation
        const modelSelect = document.getElementById('modelSelect');
        const methodSelect = document.getElementById('methodSelect');
        const explainBtn = document.getElementById('explainBtn');

        modelSelect.addEventListener('change', updateMethodSelect);

        explainBtn.addEventListener('click', async () => {
            if (!uploadedFile) return;

            const model = modelSelect.value;
            const method = methodSelect.value;

            const formData = new FormData();
            formData.append('image', uploadedFile);
            formData.append('model', model);
            formData.append('method', method);

            document.getElementById('xaiLoading').style.display = 'block';
            document.getElementById('xaiResults').innerHTML = '';

            try {
                const response = await fetch('/explain', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    displayXAIResults(data);
                } else {
                    alert('Error: ' + (data.error || 'Unknown error'));
                }
            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                document.getElementById('xaiLoading').style.display = 'none';
            }
        });

        function displayXAIResults(data) {
            const results = document.getElementById('xaiResults');
            results.innerHTML = '';

            if (data.images.heatmap) {
                const heatmapDiv = document.createElement('div');
                heatmapDiv.className = 'xai-image';
                heatmapDiv.innerHTML = `
                    <h4>${data.method === 'gradcam' ? 'Grad-CAM Heatmap' : 'LIME Explanation'}</h4>
                    <img src="${data.images.heatmap}" alt="Heatmap">
                `;
                results.appendChild(heatmapDiv);
            }

            if (data.images.overlay) {
                const overlayDiv = document.createElement('div');
                overlayDiv.className = 'xai-image';
                overlayDiv.innerHTML = `
                    <h4>${data.method === 'gradcam' ? 'Overlay' : 'Full Explanation Map'}</h4>
                    <img src="${data.images.overlay}" alt="Overlay">
                `;
                results.appendChild(overlayDiv);
            }
        }

        // Initialize
        checkModelsStatus();
    </script>
</body>
</html>
